name: Code quality

on:
  pull_request:
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned checks
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
          curl --fail --location --silent --show-error \
            --output /tmp/actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum --check
          tar --extract --gzip --file /tmp/actionlint.tar.gz --directory /tmp actionlint

      - name: Check Python
        run: |
          ruff check --output-format=github esphome/components/smabluetooth_solar
          ruff format --check esphome/components/smabluetooth_solar

      - name: Check YAML
        run: yamllint --strict .

      - name: Check C++ formatting
        run: |
          clang-format --dry-run --Werror \
            esphome/components/smabluetooth_solar/*.cpp \
            esphome/components/smabluetooth_solar/*.h

      - name: Check GitHub Actions syntax
        run: /tmp/actionlint

      - name: Audit GitHub Actions security
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format=github .github/workflows
