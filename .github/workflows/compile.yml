name: ESPHome compile tests

on:
  pull_request:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: ESPHome ${{ matrix.esphome-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        esphome-version:
          - stable
          - beta
          - dev

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Compile full test configuration
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${{ github.workspace }}:/config" \
            --workdir /config \
            "ghcr.io/esphome/esphome:${{ matrix.esphome-version }}" \
            compile tests/compile.yaml

      - name: Compile minimal test configuration using full-build cache
        if: matrix.esphome-version == 'stable'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${{ github.workspace }}:/config" \
            --workdir /config \
            ghcr.io/esphome/esphome:stable \
            compile tests/minimal.yaml

      - name: Verify invalid configurations are rejected
        if: github.event_name == 'pull_request' && matrix.esphome-version == 'stable'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "${{ github.workspace }}:/config" \
            --workdir /config \
            --entrypoint /bin/bash \
            ghcr.io/esphome/esphome:stable \
            tests/check-invalid-configs.sh
